/* ---- Logika Jaspro (disalin apa adanya dari jaspro.html: pencocokan nama, golongan, workbook ExcelJS, CSV) ---- */
const JX = (() => {
            /*
 * PNBP NR Tool - Core business logic (pure functions, no DOM/Node dependency)
 * Works identically in Node (for automated testing) and in the browser.
 */

            // ---------- Name normalization & matching ----------

            function normalizeCoreName(raw) {
                if (!raw)
                    return '';
                let s = String(raw).trim();
                const idx = s.indexOf(',');
                if (idx !== -1)
                    s = s.slice(0, idx);
                s = s.toUpperCase().replace(/\./g, ' ').replace(/\s+/g, ' ').trim();
                return s;
            }

            var HONORIFIC_TOKENS = ['H', 'HJ', 'DR', 'DRS', 'DRA', 'IR', 'PROF', 'K', 'KH', 'TH', 'HAJI', 'HAJJAH', 'R', 'RA', 'RD'];
            var HONORIFIC_SET = (function(arr) {
                var s = {};
                for (var i = 0; i < arr.length; i++)
                    s[arr[i]] = true;
                return s;
            }
            )(HONORIFIC_TOKENS);

            function stripHonorifics(normName) {
                var tokens = normName.split(' ').filter(function(t) {
                    return t && !HONORIFIC_SET[t];
                });
                return tokens.join(' ');
            }

            function levenshtein(a, b) {
                var m = a.length
                  , n = b.length;
                if (m === 0)
                    return n;
                if (n === 0)
                    return m;
                var dp = new Array(n + 1);
                for (var j = 0; j <= n; j++)
                    dp[j] = j;
                for (var i = 1; i <= m; i++) {
                    var prev = dp[0];
                    dp[0] = i;
                    for (j = 1; j <= n; j++) {
                        var tmp = dp[j];
                        dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
                        prev = tmp;
                    }
                }
                return dp[n];
            }

            function similarity(a, b) {
                if (!a && !b)
                    return 1;
                if (!a || !b)
                    return 0;
                var dist = levenshtein(a, b);
                var maxLen = Math.max(a.length, b.length);
                return maxLen === 0 ? 1 : 1 - dist / maxLen;
            }

            // Build an index: normalized core name -> [master entries]
            function buildMasterIndex(masterList) {
                var exactMap = {};
                masterList.forEach(function(entry) {
                    var norm = normalizeCoreName(entry.nama);
                    if (!exactMap[norm])
                        exactMap[norm] = [];
                    exactMap[norm].push(entry);
                });
                return exactMap;
            }

            // Match a single input name against the master list.
            // Returns { status, entry, candidates, score }
            // status: 'OTOMATIS' | 'OTOMATIS_FUZZY' | 'AMBIGU' | 'TIDAK_DITEMUKAN'
            function matchPenghulu(inputName, masterList, exactMap) {
                var norm = normalizeCoreName(inputName);

                if (exactMap[norm] && exactMap[norm].length) {
                    var arr = exactMap[norm];
                    return {
                        status: arr.length > 1 ? 'AMBIGU' : 'OTOMATIS',
                        entry: arr[0],
                        candidates: arr,
                        score: 1
                    };
                }

                var stripped = stripHonorifics(norm);
                if (stripped) {
                    for (var key in exactMap) {
                        if (!Object.prototype.hasOwnProperty.call(exactMap, key))
                            continue;
                        if (stripHonorifics(key) === stripped) {
                            var arr2 = exactMap[key];
                            return {
                                status: arr2.length > 1 ? 'AMBIGU' : 'OTOMATIS',
                                entry: arr2[0],
                                candidates: arr2,
                                score: 0.99
                            };
                        }
                    }
                }

                var scored = masterList.map(function(entry) {
                    return {
                        entry: entry,
                        score: similarity(norm, normalizeCoreName(entry.nama))
                    };
                }).sort(function(a, b) {
                    return b.score - a.score;
                });

                var best = scored[0];
                if (best && best.score >= 0.85) {
                    return {
                        status: 'OTOMATIS_FUZZY',
                        entry: best.entry,
                        candidates: scored.slice(0, 3).map(function(s) {
                            return s.entry;
                        }),
                        score: best.score
                    };
                }
                return {
                    status: 'TIDAK_DITEMUKAN',
                    entry: null,
                    candidates: scored.slice(0, 3).map(function(s) {
                        return s.entry;
                    }),
                    score: best ? best.score : 0
                };
            }

            // ---------- Golongan classification ----------
            // Returns 'III' | 'IV' | 'PPPK' | 'UNKNOWN'
            function classifyGolongan(golRaw) {
                var g = String(golRaw || '').trim().toUpperCase();
                if (!g)
                    return 'UNKNOWN';
                if (/PPPK/.test(g))
                    return 'PPPK';

                // Strategy 1: leading roman-numeral run - handles "III/a", "IIIa", "IVb", "IIa"
                var m = g.match(/^([IVX]+)/);
                if (m) {
                    if (m[1] === 'IX')
                        return 'PPPK';
                    if (m[1] === 'IV')
                        return 'IV';
                    if (m[1] === 'III')
                        return 'III';
                    if (m[1] === 'II')
                        return 'II';
                }

                // Strategy 2: leading arabic digit - handles "3/a", "4A", "2/b"
                m = g.match(/^(\d+)/);
                if (m) {
                    if (m[1] === '9')
                        return 'PPPK';
                    if (m[1] === '4')
                        return 'IV';
                    if (m[1] === '3')
                        return 'III';
                    if (m[1] === '2')
                        return 'II';
                }

                // Strategy 3: word-boundary search anywhere - handles "GOL. IV/A", "GOLONGAN III"
                if (/\bIX\b/.test(g))
                    return 'PPPK';
                if (/\bIV\b/.test(g))
                    return 'IV';
                if (/\bIII\b/.test(g))
                    return 'III';
                if (/\bII\b/.test(g))
                    return 'II';

                return 'UNKNOWN';
            }

            function golonganLabel(golClass) {
                if (golClass === 'II')
                    return 'PNS Gol. II';
                if (golClass === 'III')
                    return 'PNS Gol. III';
                if (golClass === 'IV')
                    return 'PNS Gol. IV';
                if (golClass === 'PPPK')
                    return 'PPPK Gol. IX';
                return 'Tidak dikenali';
            }

            // ---------- Number parsing (defensive, handles Indonesian-formatted text numbers) ----------
            function parseNumberID(raw) {
                if (raw == null || raw === '')
                    return 0;
                if (typeof raw === 'number')
                    return isNaN(raw) ? 0 : raw;
                if (typeof raw === 'object') {
                    if ('result' in raw)
                        return parseNumberID(raw.result);
                    if (raw.text != null)
                        return parseNumberID(raw.text);
                    if (raw.richText)
                        return parseNumberID(raw.richText.map(function(r) {
                            return r.text;
                        }).join(''));
                }
                var s = String(raw).trim();
                if (s === '')
                    return 0;
                s = s.replace(/[^\d.,-]/g, '');
                if (s === '')
                    return 0;
                if (s.indexOf(',') !== -1 && s.lastIndexOf(',') > s.lastIndexOf('.')) {
                    s = s.replace(/\./g, '').replace(',', '.');
                } else {
                    s = s.replace(/,/g, '');
                    var parts = s.split('.');
                    if (parts.length > 1 && parts.slice(1).every(function(p) {
                        return p.length === 3;
                    })) {
                        s = parts.join('');
                    }
                }
                var n = parseFloat(s);
                return isNaN(n) ? 0 : n;
            }

            // Extract a plain string from a possibly-rich ExcelJS cell value (handles
            // hyperlink objects, rich text, formula-result objects, and plain values).
            function cellText(raw) {
                if (raw == null)
                    return '';
                if (typeof raw === 'object') {
                    if ('result' in raw)
                        return cellText(raw.result);
                    if (raw.text != null)
                        return cellText(raw.text);
                    if (raw.richText)
                        return raw.richText.map(function(r) {
                            return r.text;
                        }).join('');
                    if (raw instanceof Date)
                        return raw.toISOString();
                }
                return String(raw).trim();
            }

            // ---------- Spreadsheet column letter helper ----------
            function colLetter(n) {
                var s = '';
                while (n > 0) {
                    var rem = (n - 1) % 26;
                    s = String.fromCharCode(65 + rem) + s;
                    n = Math.floor((n - 1) / 26);
                }
                return s;
            }

            // ---------- Header alias resolution ----------
            function normalizeHeader(s) {
                return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
            }

            function findHeaderColumn(headerCells, aliases) {
                // headerCells: [{colNumber, norm}]
                for (var i = 0; i < aliases.length; i++) {
                    for (var j = 0; j < headerCells.length; j++) {
                        if (headerCells[j].norm === aliases[i])
                            return headerCells[j].colNumber;
                    }
                }
                return null;
            }

            var LAPORAN_ALIASES = {
                nama: ['nama penghulu', 'nama', 'nama lengkap', 'nama pegawai'],
                kua: ['kua', 'nama kua', 'unit kerja', 'satuan kerja'],
                nip: ['nip'],
                golongan: ['golongan', 'gol', 'gol/ruang', 'golongan/ruang', 'gol ruang'],
                jumlahPeristiwa: ['jumlah peristiwa', 'jml peristiwa', 'peristiwa', 'jumlah nikah rujuk', 'jumlah nr'],
                noRekening: ['no rekening', 'nomor rekening', 'rekening'],
            };

            var MASTER_ALIASES = {
                nama: ['nama'],
                namaPemilik: ['namapemilik', 'nama pemilik', 'nama pemilik rekening'],
                noRekening: ['nomorrekening', 'nomor rekening', 'no rekening', 'rekening'],
            };

            var BULAN_LIST = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];

            if (typeof module !== 'undefined' && module.exports) {
                module.exports = {
                    normalizeCoreName: normalizeCoreName,
                    stripHonorifics: stripHonorifics,
                    levenshtein: levenshtein,
                    similarity: similarity,
                    buildMasterIndex: buildMasterIndex,
                    matchPenghulu: matchPenghulu,
                    classifyGolongan: classifyGolongan,
                    golonganLabel: golonganLabel,
                    parseNumberID: parseNumberID,
                    cellText: cellText,
                    colLetter: colLetter,
                    normalizeHeader: normalizeHeader,
                    findHeaderColumn: findHeaderColumn,
                    LAPORAN_ALIASES: LAPORAN_ALIASES,
                    MASTER_ALIASES: MASTER_ALIASES,
                    BULAN_LIST: BULAN_LIST,
                };
            }
            /*
 * PNBP NR Tool - Excel I/O
 * Parsing of uploaded workbooks and generation of the final output workbook.
 * Depends on: ExcelJS (global), logic.js (global functions/constants)
 */

            var CURRENCY_FMT = '_-* #,##0_-;-* #,##0_-;_-* "-"_-;_-@_-';
            var THIN = {
                style: 'thin'
            };
            var BORDER_ALL = {
                top: THIN,
                left: THIN,
                bottom: THIN,
                right: THIN
            };
            var REPORT_FONT = 'Arial';

            // ---------- Helpers ----------

            async function readWorkbookFromFile(file) {
                var buf = await file.arrayBuffer();
                var wb = new ExcelJS.Workbook();
                await wb.xlsx.load(buf);
                return wb;
            }

            function buildHeaderCells(headerRow) {
                var cells = [];
                headerRow.eachCell(function(cell, colNumber) {
                    cells.push({
                        colNumber: colNumber,
                        norm: normalizeHeader(cell.value)
                    });
                });
                return cells;
            }

            // ---------- Parse: Laporan Nominatif (input 1) ----------

            async function parseLaporanFile(file) {
                var wb;
                try {
                    wb = await readWorkbookFromFile(file);
                } catch (e) {
                    return {
                        ok: false,
                        error: 'File tidak dapat dibaca. Pastikan file berformat .xlsx yang valid (' + (e && e.message ? e.message : e) + ').'
                    };
                }
                var ws = wb.worksheets[0];
                if (!ws)
                    return {
                        ok: false,
                        error: 'Tidak ada sheet yang ditemukan dalam file.'
                    };

                var headerRowNum = 1;
                var headerCells = buildHeaderCells(ws.getRow(headerRowNum));
                var found = Object.keys(headerCells).length ? headerCells : [];

                var colNama = findHeaderColumn(headerCells, LAPORAN_ALIASES.nama);
                var colKua = findHeaderColumn(headerCells, LAPORAN_ALIASES.kua);
                var colNip = findHeaderColumn(headerCells, LAPORAN_ALIASES.nip);
                var colGol = findHeaderColumn(headerCells, LAPORAN_ALIASES.golongan);
                var colJumlah = findHeaderColumn(headerCells, LAPORAN_ALIASES.jumlahPeristiwa);
                var colRek = findHeaderColumn(headerCells, LAPORAN_ALIASES.noRekening);
                // optional

                var missing = [];
                if (!colNama)
                    missing.push('Nama Penghulu');
                if (!colKua)
                    missing.push('KUA');
                if (!colNip)
                    missing.push('NIP');
                if (!colGol)
                    missing.push('Golongan');
                if (!colJumlah)
                    missing.push('Jumlah Peristiwa');

                if (missing.length) {
                    var foundHeaders = headerCells.map(function(h) {
                        return h.norm;
                    }).filter(Boolean);
                    return {
                        ok: false,
                        error: 'Kolom wajib tidak ditemukan di baris pertama: ' + missing.join(', ') + '. ' + 'Kolom yang terbaca dari file: ' + (foundHeaders.length ? foundHeaders.join(', ') : '(tidak ada)') + '.',
                    };
                }

                var rows = [];
                var skipped = 0;
                ws.eachRow(function(row, rowNum) {
                    if (rowNum <= headerRowNum)
                        return;
                    var namaRaw = row.getCell(colNama).value;
                    var namaText = cellText(namaRaw);
                    if (!namaText) {
                        return;
                    }
                    if (/^jumlah$/i.test(namaText) || /^total$/i.test(namaText)) {
                        skipped++;
                        return;
                    }

                    rows.push({
                        nama: namaText,
                        kua: cellText(row.getCell(colKua).value),
                        nip: cellText(row.getCell(colNip).value),
                        golongan: cellText(row.getCell(colGol).value),
                        jumlahPeristiwa: parseNumberID(row.getCell(colJumlah).value),
                        noRekeningSumber: colRek ? cellText(row.getCell(colRek).value) : '',
                    });
                });

                if (!rows.length) {
                    return {
                        ok: false,
                        error: 'Tidak ada baris data yang terbaca. Pastikan data dimulai tepat di bawah baris judul kolom.'
                    };
                }

                return {
                    ok: true,
                    rows: rows,
                    sheetName: ws.name,
                    skipped: skipped
                };
            }

            // ---------- Parse: Master Rekening (input 2) ----------

            async function parseMasterFile(file) {
                var wb;
                try {
                    wb = await readWorkbookFromFile(file);
                } catch (e) {
                    return {
                        ok: false,
                        error: 'File tidak dapat dibaca. Pastikan file berformat .xlsx yang valid (' + (e && e.message ? e.message : e) + ').'
                    };
                }
                var ws = wb.worksheets[0];
                if (!ws)
                    return {
                        ok: false,
                        error: 'Tidak ada sheet yang ditemukan dalam file.'
                    };

                var headerCells = buildHeaderCells(ws.getRow(1));
                var colNama = findHeaderColumn(headerCells, MASTER_ALIASES.nama);
                var colPemilik = findHeaderColumn(headerCells, MASTER_ALIASES.namaPemilik);
                var colRek = findHeaderColumn(headerCells, MASTER_ALIASES.noRekening);

                var missing = [];
                if (!colNama)
                    missing.push('Nama');
                if (!colRek)
                    missing.push('NomorRekening');
                if (missing.length) {
                    var foundHeaders = headerCells.map(function(h) {
                        return h.norm;
                    }).filter(Boolean);
                    return {
                        ok: false,
                        error: 'Kolom wajib tidak ditemukan di baris pertama: ' + missing.join(', ') + '. ' + 'Kolom yang terbaca dari file: ' + (foundHeaders.length ? foundHeaders.join(', ') : '(tidak ada)') + '.',
                    };
                }

                var entries = [];
                ws.eachRow(function(row, rowNum) {
                    if (rowNum === 1)
                        return;
                    var namaText = cellText(row.getCell(colNama).value);
                    if (!namaText)
                        return;
                    entries.push({
                        id: 'imp_' + rowNum + '_' + Date.now() + '_' + Math.floor(Math.random() * 1e6),
                        nama: namaText,
                        namaPemilik: colPemilik ? (cellText(row.getCell(colPemilik).value) || namaText) : namaText,
                        noRekening: colRek ? cellText(row.getCell(colRek).value) : '',
                    });
                });

                if (!entries.length) {
                    return {
                        ok: false,
                        error: 'Tidak ada baris data yang terbaca dari file Master Rekening.'
                    };
                }

                return {
                    ok: true,
                    entries: entries
                };
            }

            // ---------- Generate: output workbook ----------

            function buildReportSheet(ws, opts) {
                var title = opts.title
                  , rows = opts.rows
                  , kind = opts.kind
                  , settings = opts.settings
                  , footer = opts.footer;
                var isJaspro = kind === 'jaspro';

                // Column A (blank spacer) and the second, always-empty "NO. REKENING" column
                // have been removed — "NO. REKENING CSV" is now the sheet's only rekening column.
                var COL = {
                    no: 1,
                    nama: 2,
                    kua: 3,
                    nip: 4,
                    gol: 5,
                    rekcsv: 6,
                    jumlah: 7,
                    tarif: 8,
                    subtotal: 9
                };
                if (isJaspro) {
                    COL.pph = 10;
                    COL.diterima = 11;
                } else {
                    COL.diterima = 10;
                }
                var lastColNum = COL.diterima;

                var widths = {
                    1: 6.9,
                    2: 40,
                    3: 24.5,
                    4: 22.5,
                    5: 9.5,
                    6: 19.5,
                    7: 8.5,
                    8: 11.7,
                    9: 15.1,
                    10: 15.5,
                    11: 19.3
                };
                Object.keys(widths).forEach(function(c) {
                    ws.getColumn(Number(c)).width = widths[c];
                });

                ws.mergeCells(2, COL.nama, 2, lastColNum);
                var t = ws.getCell(2, COL.nama);
                t.value = title;
                t.font = {
                    name: REPORT_FONT,
                    size: 14,
                    bold: true
                };
                t.alignment = {
                    horizontal: 'center',
                    vertical: 'middle',
                    wrapText: true
                };
                ws.getRow(2).height = 24;

                var headers = isJaspro ? ['No', 'NAMA', 'KUA', 'NIP', 'GOL', 'NO. REKENING CSV', 'JUMLAH', 'TARIF', 'JUMLAH', 'PPH', 'JUMLAH DITERIMA'] : ['No', 'NAMA', 'KUA', 'NIP', 'GOL', 'NO. REKENING CSV', 'JUMLAH', 'TARIF', 'JUMLAH', 'JUMLAH DITERIMA'];
                headers.forEach(function(h, i) {
                    var cell = ws.getCell(4, COL.no + i);
                    cell.value = h;
                    cell.font = {
                        name: REPORT_FONT,
                        size: 11,
                        bold: true
                    };
                    cell.alignment = {
                        horizontal: 'center',
                        vertical: 'middle',
                        wrapText: true
                    };
                    cell.border = BORDER_ALL;
                    cell.fill = {
                        type: 'pattern',
                        pattern: 'solid',
                        fgColor: {
                            argb: 'FFE8ECEF'
                        }
                    };
                });
                ws.getRow(4).height = 30;

                var firstDataRow = 5;
                var r = firstDataRow;
                rows.forEach(function(row, idx) {
                    var R = ws.getRow(r);

                    var cNo = R.getCell(COL.no);
                    cNo.value = idx + 1;
                    cNo.numFmt = '0';
                    cNo.alignment = {
                        horizontal: 'center',
                        vertical: 'center'
                    };
                    cNo.border = BORDER_ALL;
                    cNo.font = {
                        name: REPORT_FONT,
                        size: 11
                    };
                    var cNama = R.getCell(COL.nama);
                    cNama.value = row.nama;
                    cNama.alignment = {
                        horizontal: 'left',
                        vertical: 'center',
                        wrapText: true
                    };
                    cNama.border = BORDER_ALL;
                    cNama.font = {
                        name: REPORT_FONT,
                        size: 11
                    };
                    var cKua = R.getCell(COL.kua);
                    cKua.value = row.kua;
                    cKua.alignment = {
                        horizontal: 'left',
                        vertical: 'center'
                    };
                    cKua.border = BORDER_ALL;
                    cKua.font = {
                        name: REPORT_FONT,
                        size: 11
                    };
                    var cNip = R.getCell(COL.nip);
                    cNip.value = row.nip;
                    cNip.numFmt = '@';
                    cNip.alignment = {
                        horizontal: 'center',
                        vertical: 'center'
                    };
                    cNip.border = BORDER_ALL;
                    cNip.font = {
                        name: REPORT_FONT,
                        size: 11
                    };
                    var cGol = R.getCell(COL.gol);
                    cGol.value = row.golongan;
                    cGol.alignment = {
                        horizontal: 'center',
                        vertical: 'center'
                    };
                    cGol.border = BORDER_ALL;
                    cGol.font = {
                        name: REPORT_FONT,
                        size: 11
                    };
                    var cRekCsv = R.getCell(COL.rekcsv);
                    cRekCsv.value = row.rekening || '';
                    cRekCsv.numFmt = '@';
                    cRekCsv.alignment = {
                        horizontal: 'center',
                        vertical: 'center'
                    };
                    cRekCsv.border = BORDER_ALL;
                    cRekCsv.font = {
                        name: REPORT_FONT,
                        size: 11
                    };

                    var cJumlah = R.getCell(COL.jumlah);
                    cJumlah.value = row.jumlahPeristiwa;
                    cJumlah.numFmt = '0';
                    cJumlah.alignment = {
                        horizontal: 'center',
                        vertical: 'center'
                    };
                    cJumlah.border = BORDER_ALL;
                    cJumlah.font = {
                        name: REPORT_FONT,
                        size: 11
                    };

                    var tarifValue = isJaspro ? settings.tarifJaspro : settings.tarifTransport;
                    var cTarif = R.getCell(COL.tarif);
                    cTarif.value = tarifValue;
                    cTarif.numFmt = CURRENCY_FMT;
                    cTarif.alignment = {
                        horizontal: 'center',
                        vertical: 'center'
                    };
                    cTarif.border = BORDER_ALL;
                    cTarif.font = {
                        name: REPORT_FONT,
                        size: 11
                    };

                    var colJumlahL = colLetter(COL.jumlah)
                      , colTarifL = colLetter(COL.tarif)
                      , colSubtotalL = colLetter(COL.subtotal);
                    var subtotalValue = isJaspro ? row.jasproSubtotal : row.transpoSubtotal;
                    var cSubtotal = R.getCell(COL.subtotal);
                    cSubtotal.value = {
                        formula: colJumlahL + r + '*' + colTarifL + r,
                        result: subtotalValue
                    };
                    cSubtotal.numFmt = CURRENCY_FMT;
                    cSubtotal.alignment = {
                        horizontal: 'right',
                        vertical: 'center'
                    };
                    cSubtotal.border = BORDER_ALL;
                    cSubtotal.font = {
                        name: REPORT_FONT,
                        size: 11
                    };

                    if (isJaspro) {
                        var colPphL = colLetter(COL.pph);
                        var ratePctStr = (row.pphRate != null ? (row.pphRate * 100) : 0) + '%';
                        var cPph = R.getCell(COL.pph);
                        cPph.value = {
                            formula: colSubtotalL + r + '*' + ratePctStr,
                            result: row.jasproPph
                        };
                        cPph.numFmt = CURRENCY_FMT;
                        cPph.alignment = {
                            horizontal: 'right',
                            vertical: 'center'
                        };
                        cPph.border = BORDER_ALL;
                        cPph.font = {
                            name: REPORT_FONT,
                            size: 11
                        };

                        var cDiterima = R.getCell(COL.diterima);
                        cDiterima.value = {
                            formula: colSubtotalL + r + '-' + colPphL + r,
                            result: row.jasproDiterima
                        };
                        cDiterima.numFmt = CURRENCY_FMT;
                        cDiterima.alignment = {
                            horizontal: 'right',
                            vertical: 'center'
                        };
                        cDiterima.border = BORDER_ALL;
                        cDiterima.font = {
                            name: REPORT_FONT,
                            size: 11,
                            bold: true
                        };
                    } else {
                        var cDiterima2 = R.getCell(COL.diterima);
                        cDiterima2.value = {
                            formula: colSubtotalL + r,
                            result: row.transpoDiterima
                        };
                        cDiterima2.numFmt = CURRENCY_FMT;
                        cDiterima2.alignment = {
                            horizontal: 'right',
                            vertical: 'center'
                        };
                        cDiterima2.border = BORDER_ALL;
                        cDiterima2.font = {
                            name: REPORT_FONT,
                            size: 11,
                            bold: true
                        };
                    }
                    r++;
                });

                var totalRow = r;
                var lastDataRow = r - 1;
                ws.mergeCells(totalRow, COL.no, totalRow, COL.rekcsv);
                var labelCell = ws.getCell(totalRow, COL.no);
                labelCell.value = 'JUMLAH';
                labelCell.font = {
                    name: REPORT_FONT,
                    size: 11,
                    bold: true
                };
                labelCell.alignment = {
                    horizontal: 'right',
                    vertical: 'center'
                };
                labelCell.border = {
                    top: THIN,
                    bottom: THIN,
                    left: THIN
                };
                ws.getCell(totalRow, COL.rekcsv).border = {
                    top: THIN,
                    bottom: THIN,
                    right: THIN
                };

                function sumCol(colNum) {
                    var cl = colLetter(colNum);
                    var cell = ws.getCell(totalRow, colNum);
                    var total = 0;
                    rows.forEach(function(row) {
                        if (colNum === COL.jumlah)
                            total += row.jumlahPeristiwa;
                        else if (colNum === COL.subtotal)
                            total += isJaspro ? row.jasproSubtotal : row.transpoSubtotal;
                        else if (isJaspro && colNum === COL.pph)
                            total += row.jasproPph;
                        else if (colNum === COL.diterima)
                            total += isJaspro ? row.jasproDiterima : row.transpoDiterima;
                    });
                    cell.value = {
                        formula: 'SUM(' + cl + firstDataRow + ':' + cl + lastDataRow + ')',
                        result: total
                    };
                    cell.numFmt = colNum === COL.jumlah ? '#,##0' : CURRENCY_FMT;
                    cell.font = {
                        name: REPORT_FONT,
                        size: 11,
                        bold: true
                    };
                    cell.alignment = {
                        horizontal: 'center',
                        vertical: 'center'
                    };
                    cell.border = BORDER_ALL;
                    return total;
                }
                sumCol(COL.jumlah);
                ws.getCell(totalRow, COL.tarif).border = BORDER_ALL;
                sumCol(COL.subtotal);
                if (isJaspro)
                    sumCol(COL.pph);
                sumCol(COL.diterima);
                ws.getRow(totalRow).height = 18;

                // Footer / signature block — text at 12pt, with extra blank rows left for the
                // physical signature/stamp between the "jabatan" line and the printed name.
                var SIGNATURE_FONT_SIZE = 12;
                var fr = totalRow + 3;
                function mergeSet(row, colFrom, colTo, value, opts) {
                    opts = opts || {};
                    if (colTo > colFrom)
                        ws.mergeCells(row, colFrom, row, colTo);
                    var c = ws.getCell(row, colFrom);
                    c.value = value;
                    var f = {
                        name: REPORT_FONT,
                        size: SIGNATURE_FONT_SIZE,
                        bold: true
                    };
                    if (opts.font)
                        for (var k in opts.font)
                            f[k] = opts.font[k];
                    c.font = f;
                    c.alignment = {
                        horizontal: opts.h || 'left',
                        vertical: opts.v || 'top',
                        wrapText: false
                    };
                    return c;
                }
                var leftFrom = COL.nama
                  , leftTo = COL.kua;
                var midFrom = COL.gol
                  , midTo = COL.rekcsv;
                var rightFrom = isJaspro ? COL.pph : COL.tarif
                  , rightTo = COL.diterima;

                mergeSet(fr, leftFrom, leftTo, 'Mengetahui,');
                mergeSet(fr, midFrom, midTo, footer.ppkLabel1 || 'Setuju Dibayar', {
                    h: 'center'
                });
                mergeSet(fr, rightFrom, rightTo, footer.tempatTanggal, {
                    h: 'right'
                });
                mergeSet(fr + 1, leftFrom, leftTo, footer.kpaJabatan);
                mergeSet(fr + 1, midFrom, midTo, footer.ppkJabatan, {

                        // point to the same rekening once matched/confirmed, and must be paid as

                        if (!g.rekening && row.rekening)

function jpClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'tab') { J.tab = b.dataset.tab; $('jmsg').innerHTML = ''; jpRender(); }
  else if (a === 'upl') $('jfl').click();
  else if (a === 'clr') jpAsk('Hapus laporan tersimpan?', 'Laporan Nominatif yang tersimpan di server akan dihapus.', 'Hapus', async () => { J.laporan = null; J.rows = null; if (await jpSave({ laporan: null })) jpRender(); }, true);
  else if (a === 'mimp') $('jfm').click();
  else if (a === 'mexp') jpMExp();
  else if (a === 'madd') jpMForm();
  else if (a === 'medit') jpMForm(id);
  else if (a === 'mdel') {
    const m = J.master.find(x => x.id === id);
    if (m) jpAsk('Hapus data penghulu?', `"${m.nama}" akan dihapus dari Master Rekening.`, 'Hapus', async () => { J.master = J.master.filter(x => x.id !== id); J.stale = true; await jpSave({ master: J.master }); jpRender(); }, true);
  }
  else if (a === 'proc') jpProcess();
  else if (a === 'use') { const r = J.rows[b.dataset.i], c = r.candidates[0]; Object.assign(r, { rekening: c.noRekening, namaPemilik: c.namaPemilik, matchStatus: 'MANUAL' }); jpReview(); }
  else if (a === 'dxl') jpDl('xlsx');
  else if (a === 'dcj') jpDl('jaspro');
  else if (a === 'dct') jpDl('transpo');
}
function jpChange(e) {
  const t = e.target, d = t.dataset;
  if (t.id === 'jfl') { jpLaporan(t.files[0]); t.value = ''; }
  else if (t.id === 'jfm') { jpImport(t.files[0]); t.value = ''; }
  else if (d.i != null && J.rows) {
    const r = J.rows[d.i];
    if (d.f === 'gol') { r.golongan = t.value; Object.assign(r, JX.classifyRow(r, J.set)); jpReview(); }
    else if (d.f === 'rek') { r.rekening = t.value.trim(); r.matchStatus = 'MANUAL'; const m = J.master.find(x => x.noRekening === r.rekening); if (m) r.namaPemilik = m.namaPemilik; jpReview(); }
    else if (d.f === 'own') r.namaPemilik = t.value.trim();
  }
}

  return raw || '-';
}
function resolveAlamatLengkapPihakSatu_(record) {
  const raw = String(record.pihakSatuAlamat || '').trim();
  if (raw && alamatSudahLengkap_(raw)) return raw;
  const fallback = (_settingsCache && _settingsCache.ALAMAT_BIMAS_LENGKAP) || '';

/**
 * pdf.js
 * ============================================================================
 * Menghasilkan PDF Berita Acara Serah Terima Sarana Administrasi NR yang
 * tampilannya mengikuti contoh dokumen resmi (kop surat, tabel, tanda
 * tangan). Dipakai dari halaman Riwayat (tombol Download PDF / Lihat).
 *
 * Bergantung pada jsPDF + jsPDF-AutoTable (dimuat via CDN di index.html)
 * dan pada beberapa fungsi/konstanta global dari script.js: ROMAN_NUMERALS,
 * buildNomorSuratLengkap(), pad3(), _settingsCache. File ini HARUS dimuat
 * setelah script.js.
 * ============================================================================
 */

// ----------------------------------------------------------------------------
// Loader jsPDF/AutoTable dengan fallback multi-CDN.
// ----------------------------------------------------------------------------
// index.html sudah memuat kedua pustaka lewat <script> statis (cdnjs) supaya
// siap lebih cepat — tapi beberapa jaringan kantor/instansi memblokir domain
// CDN tertentu, jadi kalau itu gagal (window.jspdf belum ada saat tombol
// diklik), fungsi ini mencoba memuat ULANG secara dinamis dari cdnjs lalu
// jsdelivr (penyedia infrastruktur berbeda) sebelum benar-benar menyerah.
function loadScriptOnce_(url) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = url;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Gagal memuat ' + url));
    document.head.appendChild(script);
  });
}

function hasAutoTable_() {
  return !!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && typeof window.jspdf.jsPDF.API.autoTable === 'function');
}

async function ensureJsPdfLoaded_() {
  if (hasAutoTable_()) return; // sudah lengkap (dari <script> statis di index.html atau percobaan sebelumnya)

  if (!window.jspdf) {
    const jsPdfSources = [
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js',
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js'
    ];
    for (const src of jsPdfSources) {
      try { await loadScriptOnce_(src); if (window.jspdf) break; } catch (e) { /* coba sumber berikutnya */ }
    }
    if (!window.jspdf) {
      throw new Error('Gagal memuat pustaka jsPDF dari cdnjs.cloudflare.com maupun cdn.jsdelivr.net. ' +
        'Kemungkinan jaringan ini memblokir kedua domain tsb — coba jaringan lain, atau minta admin IT membuka akses ke keduanya.');
    }
  }

  if (!hasAutoTable_()) {
    const autoTableSources = [
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js',
      'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js'
    ];
    for (const src of autoTableSources) {
      try { await loadScriptOnce_(src); if (hasAutoTable_()) break; } catch (e) { /* coba sumber berikutnya */ }
    }
    if (!hasAutoTable_()) {
      throw new Error('Gagal memuat pustaka jsPDF-AutoTable dari cdnjs.cloudflare.com maupun cdn.jsdelivr.net.');
    }
  }
}

// Kop surat butuh logo Kemenag. Dicoba berurutan, paling andal duluan:
//
//  1. Konstanta LOGO_BASE64 dari logo-data.js — dihasilkan sekali lewat
//     assets/logo-converter.html. Ini PALING ANDAL karena logo sudah jadi
//     bagian dari kode (bukan file yang perlu dimuat saat runtime), jadi
//     tidak mungkin kena masalah file:// apa pun. Ini cara yang disarankan
//     — kalau logo tidak muncul, inilah yang seharusnya dijalankan dulu.
//  2. fetch() ke assets/logo-kemenag.png — TERBUKTI selalu diblokir CORS
//     oleh Chrome dkk. saat aplikasi dibuka lewat file:// ("Cross origin
//     requests are only supported for protocol schemes: chrome, ... " —
//     skema "file" memang tidak masuk daftar yang diizinkan sama sekali).
//     Jadi langkah ini SENGAJA DILEWATI kalau halaman sedang berjalan dari
//     file://, supaya tidak memunculkan error CORS di console yang sudah
//     pasti gagal — hanya dicoba kalau aplikasi suatu saat di-hosting via
//     http/https, di mana fetch() ini justru bisa berhasil.
//  3. <img> + canvas — cara paling lama, tapi browser tertentu memperlakukan
//     tiap URL file:// sebagai origin unik sehingga canvas.toDataURL() bisa
//     gagal walau gambarnya berhasil TAMPIL sebagai <img>.
//
// Kalau ketiganya gagal, mengembalikan null (bukan melempar error) supaya
// PDF tetap bisa dibuat tanpa logo daripada gagal total.
async function loadLogoAsDataUrl_(path) {
  if (typeof LOGO_BASE64 !== 'undefined' && LOGO_BASE64) {
    const dims = await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = LOGO_BASE64;
    });
    if (dims) return { dataUrl: LOGO_BASE64, width: dims.width, height: dims.height };
  }

  if (window.location.protocol !== 'file:') {
    try {
      const res = await fetch(path);
      if (res.ok) {
        const blob = await res.blob();
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('gagal membaca blob logo'));
          reader.readAsDataURL(blob);
        });
        const dims = await new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
          img.onerror = () => resolve(null);
          img.src = dataUrl;
        });
        if (dims) return { dataUrl: dataUrl, width: dims.width, height: dims.height };
      }
    } catch (e) {
      // lanjut ke cara 3
    }
  }

  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        resolve({ dataUrl: canvas.toDataURL('image/png'), width: img.naturalWidth, height: img.naturalHeight });
      } catch (e) {
        resolve(null); // kedua cara gagal -> PDF tetap dibuat tanpa logo
      }
    };
    img.onerror = () => resolve(null);
    img.src = path;
  });
}

function pdfWriteWrapped_(doc, text, x, y, maxWidth, lineHeight) {
  const lines = doc.splitTextToSize(text, maxWidth);
  doc.text(lines, x, y);
  return y + lines.length * lineHeight;
}

// Menulis baris "Label : Nilai" sejajar kolon, meniru gaya contoh dokumen
// ("Nama : TIEN JUNIARSIH", "NIP. : 197906..."). Kalau Nilai lebih panjang
// dari sisa ruang sampai maxRightX, dibungkus ke baris berikutnya — baris
// lanjutan tetap RATA dengan awal Nilai (bukan rata Label), dan berhenti
// TEPAT di maxRightX yang sama dipakai teks lain di dokumen ini (lihat
// pdfWriteWrapped_ untuk paragraf Pembuka/Penutup, dipanggil dengan batas
// kanan yang sama: pageWidth - marginRight).
//
// PERBAIKAN BUG: sebelum ini, fungsi hanya doc.text(nilai, x, y) tanpa
// maxWidth sama sekali — aman selama Nilai selalu pendek, tapi begitu
// Alamat mulai mencantumkan Kecamatan+Kabupaten (lihat
// resolveAlamatLengkapPihak...()), banyak Alamat jadi cukup panjang untuk
// meluber melewati batas kanan yang dipakai paragraf lain di halaman yang
// sama, membuat baris Alamat terlihat "nyeberang" / tidak sejajar dengan
// sisa dokumen. splitTextToSize() dulu sebelum ditulis (persis seperti
// pdfWriteWrapped_) memastikan baris SELALU berhenti di batas yang sama.
function pdfWriteFieldLine_(doc, label, value, x, y, labelWidth, maxRightX) {
  const valueX = x + labelWidth + 3;
  doc.text(label, x, y);
  doc.text(':', x + labelWidth, y);
  const text = String(value === undefined || value === null || value === '' ? '-' : value);
  const lines = doc.splitTextToSize(text, maxRightX - valueX);
  doc.text(lines, valueX, y);
  return y + lines.length * 5;
}

// Data Pegawai menyimpan Jabatan bersih ("JFU") terpisah dari unit
// kerjanya (Kategori/KUA) — pemisahan itu perlu untuk combobox & filter
// dropdown, tapi dokumen resmi perlu mencetak keduanya sekaligus, persis
// seperti data lama ("JFU Pada Seksi Bimas Islam"). Fungsi ini merakitnya
// kembali KHUSUS untuk dicetak, tanpa mengubah data Pegawai yang tersimpan.
//
// PERBAIKAN BUG: sebagian data Jabatan (entri lama/migrasi atau yang
// diketik manual) TERNYATA sudah menyertakan nama unit kerjanya sendiri,
// mis. "Penghulu KUA Patrol" atau "JFU Pada Seksi Bimas Islam". Kalau
// akhirannya ditempel begitu saja tanpa dicek, hasilnya dobel ("...Pada
// Seksi Bimas Islam Pada Seksi Bimas Islam"). Jadi sebelum menempelkan
// akhiran, cek dulu apakah teks jabatan SUDAH menyebut unit kerja terkait
// — kalau sudah, biarkan apa adanya.
function formatJabatanUntukCetak_(nip, jabatanMentah) {
  const cache = (typeof _pegawaiCache !== 'undefined') ? _pegawaiCache : [];
  const pegawai = cache.find((p) => p.nip === nip);
  const jabatan = jabatanMentah || '-';
  if (!pegawai) return jabatan;
  const jabatanUpper = jabatan.toUpperCase();
  if (pegawai.kategori === 'Bimas Islam') {
    if (jabatanUpper.indexOf('BIMAS ISLAM') !== -1) return jabatan;
    return jabatan + ' Pada Seksi Bimas Islam';
  }
  if (pegawai.kategori === 'KUA') {
    const kua = pegawai.kua || '';
    // Hanya cek nama kecamatan KUA-nya sendiri (bukan cek kata "KUA" secara
    // umum) — supaya jabatan bersih yang memang mengandung kata "KUA" apa
    // adanya (mis. "Operator KUA") tetap ditempeli lokasi seperti biasa.
    if (kua && jabatanUpper.indexOf(kua.toUpperCase()) !== -1) return jabatan;
    return jabatan + ' Pada KUA ' + kua;
  }
  return jabatan;
}

function bnFilter(e) {

      : lama ? `<a class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener" href="${esc(r.arsipLink)}"><i class="bx bx-link-external"></i> Buka arsip lama (Drive)</a>` : '<span class="small">Belum ada arsip.</span>'}</div>
    <input type="file" id="bfa" class="form-control form-control-sm" accept="application/pdf,image/*"><small>PDF/JPG/PNG. Mengunggah file baru menggantikan arsip yang ada.</small>

      catch (x) { jpToast(x.message, 'danger'); }

  }, 'min(760px,95vw)');

    <div class="col-12"><div class="card"><div class="card-body"><h5 class="mb-3">Data Sarana</h5><div class="row g-3">
      ${num('bb-pa', 'Porporasi awal')}${num('bb-pb', 'Porporasi akhir')}${num('bb-na', 'Banyaknya Buku NA', 'readonly')}

function bbDate(force) {
  const v = $('bb-tgl').value; if (!v) return;
  const [y, m, d] = v.split('-').map(Number), dt = new Date(y, m - 1, d);
  $('bb-sum').innerHTML = `Pada hari ini <b>${BX.getIndonesianDayName(dt)}</b>, tanggal <b>${String(d).padStart(2, '0')}</b> bulan <b>${BX.getIndonesianMonthName(dt)}</b> tahun <b>${y}</b>`;
  if (!$('bb-bs').dataset.u) $('bb-bs').value = m;
  if (force || $('bb-no').dataset.y !== String(y)) { $('bb-no').dataset.y = y; $('bb-no').value = bnNext(String(y)); }
  bbPreview();
}
function bbPreview() {
  const y = $('bb-tgl').value.split('-')[0], bs = +$('bb-bs').value, no = +$('bb-no').value;
  $('bb-ns').value = y && bs && no ? BX.buildNomorSuratLengkap(no, bs, y, B.set) : '';
}
function bbPor() {
  const a = parseInt($('bb-pa').value, 10), b = parseInt($('bb-pb').value, 10), ok = !isNaN(a) && !isNaN(b);
  if ($('bb-auto').checked && ok && b >= a) $('bb-na').value = b - a + 1;
  let m = '';
  if (ok && b < a) m = note('Nomor porporasi akhir tidak boleh lebih kecil dari awal.', 'warning');
  else if (ok) {
    const x = B.ba.find(r => { const g = bnRange(r.porporasi); return g && a <= g[1] && b >= g[0]; });
    if (x) m = note(`Nomor porporasi sudah digunakan pada BA Nomor ${x.noSurat} (rentang ${x.porporasi}).`, 'warning');
  }
  $('bb-por').innerHTML = m;
}

  else if (id === 'bb-bs') { e.target.dataset.u = 1; bbPreview(); }
  else if (id === 'bb-no') bbPreview();
  else if (id === 'bb-kua') {
    const L = B.peg.filter(p => p.kategori === 'KUA' && p.kua === e.target.value);
    $('bb-p2').disabled = !L.length;
    $('bb-p2').innerHTML = `<option value="">${L.length ? '— Pilih —' : '— Belum ada pegawai —'}</option>` + L.map(p => `<option value="${esc(p.nip)}">${esc(p.nama)} — ${esc(p.jabatan)}</option>`).join('');
    $('bb-p2i').textContent = e.target.value && !L.length ? 'KUA ini belum punya pegawai terdaftar. Tambahkan di menu Pegawai.' : '';
  }
  else if (id === 'bb-auto') { $('bb-na').readOnly = e.target.checked; bbPor(); }
  else if (id === 'bb-pa' || id === 'bb-pb') bbPor();
}
async function bbSave() {
  const v = id => $(id).value.trim(), n = id => v(id) === '' ? null : parseInt(v(id), 10);
  const p1 = B.peg.find(p => p.nip === v('bb-p1')), p2 = B.peg.find(p => p.nip === v('bb-p2'));
  if (!p1 || !p2) return jpToast('Pilih Pihak Pertama dan Pihak Kedua.', 'danger');
  if (!n('bb-no')) return jpToast('Nomor Urut wajib diisi.', 'danger');
  const [y, m, d] = v('bb-tgl').split('-').map(Number), a = n('bb-pa'), b = n('bb-pb');
  if (!y || a == null || b == null) return jpToast('Tanggal dan nomor porporasi awal & akhir wajib diisi.', 'danger');
  const dt = new Date(y, m - 1, d), btn = $('bb-save');
  const row = { nomor_urut: n('bb-no'), tahun: y, bln_srt: +v('bb-bs'), hari: BX.getIndonesianDayName(dt), tgl: String(d).padStart(2, '0'), bln: BX.getIndonesianMonthName(dt),
    pihak_satu_nip: p1.nip, pihak_satu_nama: p1.nama, pihak_satu_jabatan: p1.jabatan, pihak_satu_alamat: p1.alamat,
    pihak_kedua_nip: p2.nip, pihak_kedua_nama: p2.nama, pihak_kedua_jabatan: p2.jabatan, pihak_kedua_alamat: p2.alamat,
    banyak_na_buku: n('bb-na'), banyak_n: n('bb-n'), banyak_nb: n('bb-nb'), no_seri: v('bb-seri'), porporasi: `${a}- ${b}`,
    kasi_nama: B.set.KASI_NAMA, kasi_nip: B.set.KASI_NIP, status_simkah: v('bb-sim') };
  btn.disabled = true;
  const { data, error } = await sb.from('bast_ba').insert(row).select(BCOL).single();
  btn.disabled = false;
  if (error) return jpToast(error.message, 'danger');
  B.ba.unshift(bnOut(data));
  if (String(y) !== B.set.LAST_NUMBER_YEAR || row.nomor_urut > (+B.set.LAST_NUMBER || 0)) Object.assign(B.set, { LAST_NUMBER: String(row.nomor_urut), LAST_NUMBER_YEAR: String(y) });

}

    <div class="card"><div class="card-body"><div class="row g-2 mb-3"><div class="col-lg-5"><div class="input-group"><span class="input-group-text"><i class="bx bx-search"></i></span><input id="bpq" type="search" class="form-control" placeholder="Cari nama, NIP, jabatan, KUA…"></div></div>
      <div class="col-lg-3"><select id="bpk" class="form-select"><option value="">Semua Kategori</option><option>Bimas Islam</option><option>KUA</option></select></div></div>
      <div class="scroll"><table class="table table-hover align-middle mb-0"><thead><tr><th>Nama</th><th>NIP</th><th>Kategori</th><th>Jabatan</th><th>Unit Kerja</th><th></th></tr></thead><tbody id="bpt"></tbody></table></div><div id="bpc" class="mt-2"></div></div></div></div>`;
  if (!await bnLoad()) return;
  const r = $('broot'); r.oninput = r.onchange = bpRows;
  r.onclick = e => { const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act; if (a === 'padd') bnPegForm(); else if (a === 'pedit') bnPegForm(b.dataset.k); else if (a === 'pdel') bnPegDel(b.dataset.k); };
  bpRows();
}
function bpRows() {
  const q = $('bpq').value.toLowerCase(), k = $('bpk').value;
  const L = B.peg.filter(p => (!k || p.kategori === k) && (!q || [p.nama, p.nip, p.jabatan, p.kua].join(' ').toLowerCase().includes(q)));
  $('bpt').innerHTML = L.map(p => `<tr><td>${esc(p.nama)}</td><td>${esc(p.nip)}</td><td><span class="badge bg-label-${p.kategori === 'KUA' ? 'info' : 'primary'}">${esc(p.kategori)}</span></td><td>${esc(p.jabatan)}</td><td>${p.kategori === 'KUA' ? 'KUA ' + esc(p.kua) : 'Seksi Bimas Islam'}</td>
    <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-secondary px-2" data-act="pedit" data-k="${esc(p.nip)}" aria-label="Ubah"><i class="bx bx-edit"></i></button> <button class="btn btn-sm btn-outline-danger px-2" data-act="pdel" data-k="${esc(p.nip)}" aria-label="Hapus"><i class="bx bx-trash"></i></button></td></tr>`).join('')
    || '<tr><td colspan="6" class="text-center py-4">Belum ada pegawai.</td></tr>';
  $('bpc').textContent = `Total: ${B.peg.length} pegawai${L.length !== B.peg.length ? ' · ' + L.length + ' cocok' : ''}`;
}
function bnPegForm(nip) {
  const p = B.peg.find(x => x.nip === nip) || { kategori: 'Bimas Islam', nip: '', nama: '', jabatan: '', kua: '', alamat: BX.ALAMAT_BIMAS_DEFAULT };
  const f = (id, l, v, ex = '') => `<div class="mb-3"><label class="form-label">${l}</label><input id="${id}" class="form-control" value="${esc(v)}" ${ex}></div>`;
  bnDlg(`<h5 class="mb-3">${nip ? 'Ubah' : 'Tambah'} Pegawai</h5><div id="bfe"></div>
    <label class="form-label">Kategori</label><select id="pf-kat" class="form-select mb-3"><option${p.kategori === 'Bimas Islam' ? ' selected' : ''}>Bimas Islam</option><option${p.kategori === 'KUA' ? ' selected' : ''}>KUA</option></select>
    ${f('pf-nip', 'NIP (minimal 18 digit)', p.nip)}${f('pf-nama', 'Nama', p.nama)}${f('pf-jab', 'Jabatan', p.jabatan, 'list="pf-jl"')}<datalist id="pf-jl"></datalist>
    <div id="pf-kw" class="mb-3"><label class="form-label">KUA Kecamatan</label><select id="pf-kua" class="form-select"><option value="">— Pilih KUA —</option>${BX.KUA_LIST.map(k => `<option${k.nama === p.kua ? ' selected' : ''}>${esc(k.nama)}</option>`).join('')}</select></div>
    <div class="mb-3"><label class="form-label">Alamat</label><textarea id="pf-al" class="form-control" rows="2">${esc(p.alamat)}</textarea></div>
    <div class="d-flex justify-content-end gap-2"><button class="btn btn-outline-secondary" data-x>Batal</button><button class="btn btn-primary" data-ok>Simpan</button></div>`,
  d => {
    const kat = () => $('pf-kat').value, sync = () => {
      $('pf-jl').innerHTML = (kat() === 'KUA' ? BX.JABATAN_KUA : BX.JABATAN_BIMAS).map(j => `<option value="${esc(j)}">`).join('');
      $('pf-kw').classList.toggle('d-none', kat() !== 'KUA');
    };
    sync();
    $('pf-kat').onchange = () => { sync(); if (kat() === 'Bimas Islam' && !$('pf-al').value.trim()) $('pf-al').value = BX.ALAMAT_BIMAS_DEFAULT; };
    $('pf-kua').onchange = () => { const k = BX.KUA_LIST.find(x => x.nama === $('pf-kua').value); if (k) $('pf-al').value = k.alamat; };
    d.querySelector('[data-x]').onclick = () => d.close();
    d.querySelector('[data-ok]').onclick = async () => {
      const v = { nip: $('pf-nip').value.trim(), nama: $('pf-nama').value.trim(), kategori: kat(), jabatan: $('pf-jab').value.trim(), kua: kat() === 'KUA' ? $('pf-kua').value : '', alamat: $('pf-al').value.trim() };
      const err = v.nip.replace(/\D/g, '').length < 18 ? 'NIP minimal 18 digit.' : !v.nama || !v.jabatan || !v.alamat ? 'Nama, Jabatan, dan Alamat wajib diisi.' : v.kategori === 'KUA' && !v.kua ? 'KUA Kecamatan wajib dipilih untuk kategori KUA.' : '';
      if (err) return $('bfe').innerHTML = note(err, 'warning');
      const { error } = await (nip ? sb.from('bast_pegawai').update(v).eq('nip', nip) : sb.from('bast_pegawai').insert(v));
      if (error) return $('bfe').innerHTML = note(error.code === '23505' ? `NIP ${v.nip} sudah terdaftar.` : error.message);
      B.peg = (nip ? B.peg.map(x => x.nip === nip ? v : x) : [...B.peg, v]).sort((a, b) => a.nama.localeCompare(b.nama, 'id'));
      BX.set(B.set, B.peg); d.close(); bpRows(); jpToast('Pegawai disimpan.');
    };
  }, 'min(560px,95vw)');
}
function bnPegDel(nip) {
  const p = B.peg.find(x => x.nip === nip); if (!p) return;
  jpAsk('Hapus pegawai?', `${p.nama} (${p.nip}) dihapus dari daftar. Berita Acara lama tetap menyimpan datanya.`, 'Hapus', async () => {
    const { error } = await sb.from('bast_pegawai').delete().eq('nip', nip);
    if (error) return jpToast(error.message, 'danger');
    B.peg = B.peg.filter(x => x.nip !== nip); BX.set(B.set, B.peg); bpRows(); jpToast('Pegawai dihapus.');
  }, true);
}

/* ---- Pengaturan BAST ---- */
async function pageBastSetting() {
  $('view').innerHTML = `<div class="jp" id="broot">${bnHead('Pengaturan BAST NR', 'Format nomor surat, pejabat yang mengetahui, dan alamat kantor untuk PDF.')}<div id="bsf">Memuat…</div></div>`;
  if (!await bnLoad()) return;
  const F = [['KASI_NAMA', 'Nama Kepala Seksi (Mengetahui)'], ['KASI_NIP', 'NIP Kepala Seksi'], ['NOMOR_AWAL_SURAT', 'Nomor awal surat (tiap tahun)'], ['KODE_KANTOR', 'Kode kantor'], ['KODE_KLASIFIKASI', 'Kode klasifikasi'],
    ['NOMOR_FORMAT_TEMPLATE', 'Format nomor surat'], ['ALAMAT_BIMAS_LENGKAP', 'Alamat lengkap kantor Bimas Islam']];
  $('bsf').innerHTML = `<div class="card"><div class="card-body"><div class="row g-3">${F.map(([k, l]) => `<div class="${k.length > 16 ? 'col-12' : 'col-md-6'}"><label class="form-label">${l}</label><input class="form-control" data-k="${k}" value="${esc(B.set[k])}"></div>`).join('')}</div>
    <p class="small mt-3 mb-1">Placeholder format: {NOMOR} {KODE_KANTOR} {BULAN_ROMAWI} {KODE_KLASIFIKASI} {BULAN_ANGKA} {TAHUN}</p>
    <p class="small">Nomor terakhir terpakai: <b>${esc(B.set.LAST_NUMBER)}</b> (tahun ${esc(B.set.LAST_NUMBER_YEAR) || '-'}). Nomor berikutnya mengikuti otomatis dan kembali ke nomor awal tiap tahun baru.</p>
    <div class="d-flex justify-content-end"><button class="btn btn-primary" id="bs-save"><i class="bx bx-save"></i> Simpan Pengaturan</button></div></div></div>`;
  $('bs-save').onclick = async () => {
    const rows = [...document.querySelectorAll('#bsf [data-k]')].map(i => ({ key: i.dataset.k, value: i.value.trim() }));
    const { error } = await sb.from('bast_setting').upsert(rows, { onConflict: 'key' });
    if (error) return jpToast(error.message, 'danger');
    rows.forEach(x => { B.set[x.key] = x.value; }); BX.set(B.set, B.peg); jpToast('Pengaturan disimpan.');
  };
}
</script>
