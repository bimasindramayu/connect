<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOP KUA Indramayu</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<style>
:root{--bs-primary:#696cff;--bs-primary-rgb:105,108,255;--bs-body-font-family:'Public Sans',sans-serif;--bs-body-color:#697a8d;--bs-body-bg:#f5f5f9;--bs-heading-color:#566a7f}
h4,h5{color:#566a7f;font-weight:600}
.btn-primary{--bs-btn-bg:#696cff;--bs-btn-border-color:#696cff;--bs-btn-hover-bg:#5f61e6;--bs-btn-hover-border-color:#5f61e6;--bs-btn-active-bg:#5456cc;--bs-btn-active-border-color:#5456cc;--bs-btn-disabled-bg:#696cff;--bs-btn-disabled-border-color:#696cff;box-shadow:0 .125rem .25rem rgba(105,108,255,.4)}
.card{border:0;border-radius:.5rem;box-shadow:0 2px 6px rgba(67,89,113,.12)}
.form-control:focus{border-color:#696cff;box-shadow:0 0 .25rem .05rem rgba(105,108,255,.1)}
.brand{font-size:1.5rem;font-weight:700;color:#566a7f}.brand i{color:#696cff}
.bg-label-primary{background:rgba(105,108,255,.16)!important;color:#696cff!important}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
#auth .card{width:100%;max-width:400px}
#side{position:fixed;inset:0 auto 0 0;width:260px;background:#fff;box-shadow:0 0 10px rgba(67,89,113,.12);z-index:1030;transition:transform .2s}
#side .nav-link{display:flex;gap:.6rem;align-items:center;margin:.15rem .8rem;padding:.55rem .9rem;border-radius:.375rem;color:#697a8d}
#side .nav-link:hover{background:rgba(67,89,113,.06)}
#side .nav-link.active{background:rgba(105,108,255,.16);color:#696cff}
#main{margin-left:260px}
#topbar{background:#fff;margin:1rem 1.5rem 0;padding:.6rem 1.2rem;border-radius:.5rem;box-shadow:0 0 .375rem .25rem rgba(161,172,184,.15)}
.avatar{width:38px;height:38px;border-radius:50%;background:rgba(105,108,255,.16);color:#696cff;display:grid;place-items:center;font-weight:600}
dialog{border:0;border-radius:.5rem;padding:0;width:min(440px,calc(100% - 2rem));box-shadow:0 .5rem 2rem rgba(67,89,113,.3);color:var(--bs-body-color)}
dialog::backdrop{background:rgba(67,89,113,.5)}
@media(max-width:991px){#side{transform:translateX(-100%)}#side.open{transform:none}#main{margin-left:0}#topbar{margin:.75rem}}
</style>
</head>
<body>

<section id="auth" class="d-none">
  <div class="card"><div class="card-body p-4 p-sm-5">
    <div class="text-center mb-4"><span class="brand"><i class="bx bxs-wallet"></i> BOP KUA</span></div>
    <h5 class="mb-1">Selamat datang 👋</h5>
    <p class="mb-4">Masuk untuk mengelola BOP KUA se-Kabupaten Indramayu.</p>
    <div id="msg"></div>
    <form id="f">
      <label class="form-label" for="em">Email</label>
      <input id="em" type="email" class="form-control mb-3" autocomplete="username" required autofocus>
      <label class="form-label" for="pw">Password</label>
      <div class="input-group mb-3">
        <input id="pw" type="password" class="form-control" autocomplete="current-password" required>
        <button type="button" class="btn btn-outline-secondary" data-eye="pw" aria-label="Tampilkan password"><i class="bx bx-show"></i></button>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="rem">
        <label class="form-check-label" for="rem">Ingat saya di perangkat ini</label>
      </div>
      <div id="ts" class="mb-3"></div>
      <button class="btn btn-primary w-100" id="go">Masuk</button>
    </form>
  </div></div>
</section>

<div id="app" class="d-none">
  <aside id="side">
    <div class="p-4 pb-3"><span class="brand"><i class="bx bxs-wallet"></i> BOP KUA</span></div>
    <nav class="nav flex-column">
      <a class="nav-link" href="#bop"><i class="bx bx-wallet"></i>BOP</a>
      <a class="nav-link" href="#pengaturan"><i class="bx bx-cog"></i>Pengaturan</a>
    </nav>
  </aside>
  <div id="main">
    <div id="topbar" class="d-flex align-items-center gap-3">
      <button class="btn btn-sm d-lg-none" id="burger" aria-label="Menu"><i class="bx bx-menu fs-4"></i></button>
      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="text-end lh-sm"><div class="fw-semibold" id="uName"></div><small id="uRole"></small></div>
        <div class="avatar" id="uAv"></div>
        <button class="btn btn-sm btn-outline-secondary" id="out"><i class="bx bx-log-out"></i> Keluar</button>
      </div>
    </div>
    <main class="p-4" id="view"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====== ISI 3 NILAI INI ====== */
const CFG = {
  url: 'https://lpfwkitppdnlcakkncov.supabase.co',
  key: 'sb_publishable_AfVmUT86ttPMaiO3iUmJew_u3l3IBPF',
  turnstile: '0x4AAAAAAFKG36vwdFMGZBiz'   // test key; ganti dengan Site Key Turnstile Anda
};
/* ============================= */
const LS = localStorage, SS = sessionStorage, RK = 'bop.remember', EK = 'bop.email';
const remembered = () => LS.getItem(RK) === '1';
// Ingat saya: sesi di localStorage (tetap login setelah browser ditutup). Tidak dicentang: sessionStorage (hilang saat tab ditutup).
const authStore = {
  getItem: k => LS.getItem(k) ?? SS.getItem(k),
  setItem: (k, v) => { const [on, off] = remembered() ? [LS, SS] : [SS, LS]; off.removeItem(k); on.setItem(k, v); },
  removeItem: k => { LS.removeItem(k); SS.removeItem(k); }
};
const sb = supabase.createClient(CFG.url, CFG.key, { auth: { storage: authStore } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const note = (t, type = 'danger') => `<div class="alert alert-${type} py-2">${esc(t)}</div>`;
let me = null, token = null, wid = null;

window.tsReady = () => {
  wid = turnstile.render('#ts', { sitekey: CFG.turnstile, callback: t => token = t, 'expired-callback': () => token = null });
};
const resetCaptcha = () => { token = null; if (window.turnstile && wid != null) turnstile.reset(wid); };

const loadRemember = () => {
  $('rem').checked = remembered();
  if (remembered()) $('em').value = LS.getItem(EK) || '';
  if ($('em').value) $('pw').focus();
};
const PW_ERR = 'Password minimal 8 karakter dan harus sama di kedua kolom.';
const errId = e => ({ same_password: 'Password baru tidak boleh sama dengan password lama.', weak_password: 'Password terlalu lemah. Tambahkan huruf besar, angka, atau simbol.' }[e.code] || e.message);
const eyeBtn = id => `<button type="button" class="btn btn-outline-secondary" data-eye="${id}" aria-label="Tampilkan password"><i class="bx bx-show"></i></button>`;
const setEye = (b, on) => {
  $(b.dataset.eye).type = on ? 'text' : 'password';
  b.firstElementChild.className = 'bx ' + (on ? 'bx-hide' : 'bx-show');
  b.setAttribute('aria-label', (on ? 'Sembunyikan' : 'Tampilkan') + ' password');
};
const mask = root => root.querySelectorAll('[data-eye]').forEach(b => setEye(b, false));
document.addEventListener('click', e => { const b = e.target.closest('[data-eye]'); if (b) setEye(b, $(b.dataset.eye).type === 'password'); });
const pwPair = p => `
  <label class="form-label" for="${p}1">Password baru</label>
  <div class="input-group mb-3"><input id="${p}1" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Minimal 8 karakter" required>${eyeBtn(p + 1)}</div>
  <label class="form-label" for="${p}2">Ulangi password baru</label>
  <div class="input-group"><input id="${p}2" type="password" class="form-control" maxlength="72" autocomplete="new-password" placeholder="Ketik ulang password baru" required>${eyeBtn(p + 2)}</div>
  <div class="small mt-1 mb-3" id="${p}h" aria-live="polite"></div>`;
const pairOk = p => {
  const a = $(p + 1).value, b = $(p + 2).value, same = a === b, h = $(p + 'h');
  const bad = !same && b && (b.length >= a.length || !a.startsWith(b)); // merah hanya jika sudah pasti salah ketik
  h.className = 'small mt-1 mb-3 ' + (same && b ? 'text-success' : bad ? 'text-danger' : '');
  h.textContent = same && b ? 'Password sama.' : bad ? 'Password belum sama.' : '';
  return a.length >= 8 && same;
};
const bindPair = p => [1, 2].forEach(n => $(p + n).addEventListener('input', () => pairOk(p)));
$('dlg').onclose = () => $('dlg').replaceChildren();

$('f').onsubmit = async e => {
  e.preventDefault();
  if (!token) return $('msg').innerHTML = note('Selesaikan captcha terlebih dahulu.', 'warning');
  $('go').disabled = true; $('msg').innerHTML = '';
  const rem = $('rem').checked, mail = $('em').value.trim();
  LS.setItem(RK, rem ? '1' : '0'); // harus diset sebelum login agar sesi masuk ke storage yang benar
  const { error } = await sb.auth.signInWithPassword({
    email: mail, password: $('pw').value, options: { captchaToken: token }
  });
  $('go').disabled = false;
  if (!error) { if (rem) LS.setItem(EK, mail); else LS.removeItem(EK); }
  if (error) { $('msg').innerHTML = note('Login gagal: email/password salah atau captcha tidak valid.'); resetCaptcha(); }
};

const show = v => { $('auth').classList.toggle('d-none', v !== 'auth'); $('app').classList.toggle('d-none', v !== 'app'); };

async function boot(session) {
  if (!session) { me = null; $('f').reset(); mask($('f')); resetCaptcha(); show('auth'); return loadRemember(); }
  if (me && me.id === session.user.id) return;
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !data) {
    await sb.auth.signOut();
    $('msg').innerHTML = note('Profil akun tidak ditemukan. Hubungi admin.');
    return;
  }
  me = { ...data, email: session.user.email };
  $('uName').textContent = me.nama;
  $('uRole').textContent = me.role === 'admin' ? 'Admin' : (me.kua || 'Operator');
  $('uAv').textContent = me.nama.charAt(0).toUpperCase();
  $('pw').value = ''; show('app'); route();
}
// setTimeout menghindari deadlock pemanggilan Supabase di dalam callback auth
sb.auth.onAuthStateChange((ev, s) => { if (ev !== 'TOKEN_REFRESHED') setTimeout(() => boot(s), 0); });

$('out').onclick = () => sb.auth.signOut();
$('burger').onclick = () => $('side').classList.toggle('open');

const pages = { bop: pageBop, pengaturan: pagePengaturan };
function route() {
  if (!me) return;
  const k = location.hash.slice(1) in pages ? location.hash.slice(1) : 'bop';
  document.querySelectorAll('#side .nav-link').forEach(a => a.classList.toggle('active', a.hash === '#' + k));
  $('side').classList.remove('open');
  pages[k]();
}
addEventListener('hashchange', route);

function pageBop() {
  $('view').innerHTML = `<div class="card"><div class="card-body">
    <h4 class="mb-1">BOP</h4>
    <p>Halo, <b>${esc(me.nama)}</b>. Modul BOP akan dibangun pada tahap berikutnya.</p>
    <span class="badge bg-label-primary">Segera hadir</span></div></div>`;
}

function openReset(r) {
  if (!r) return;
  const d = $('dlg');
  d.innerHTML = `<form id="rf" class="p-4">
    <h5 class="mb-1">Reset password</h5>
    <p class="mb-3">Akun: <b>${esc(r.nama)}</b>${r.kua ? ' (' + esc(r.kua) + ')' : ''}</p>
    <div id="rmsg"></div>${pwPair('rp')}
    <button type="button" class="btn btn-sm btn-outline-secondary mb-3" id="gen"><i class="bx bx-refresh"></i> Buat password acak</button>
    <p class="small">Password lama langsung tidak berlaku. Sampaikan password baru ini ke operator yang bersangkutan.</p>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary" id="rx">Batal</button>
      <button class="btn btn-primary" id="rgo">Reset password</button></div></form>`;
  bindPair('rp');
  $('rx').onclick = () => d.close();
  $('gen').onclick = () => {
    const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    $('rp1').value = $('rp2').value = Array.from(crypto.getRandomValues(new Uint32Array(12)), n => c[n % c.length]).join('');
    d.querySelectorAll('[data-eye]').forEach(b => setEye(b, true)); pairOk('rp');
  };
  $('rf').onsubmit = async e => {
    e.preventDefault();
    if (!pairOk('rp')) return $('rmsg').innerHTML = note(PW_ERR, 'warning');
    $('rgo').disabled = true; $('rmsg').innerHTML = '';
    const { error } = await sb.functions.invoke('reset-password', { body: { user_id: r.id, password: $('rp1').value } });
    if (!error) { d.close(); return $('amsg').innerHTML = note(`Password ${r.nama} berhasil direset.`, 'success'); }
    const j = typeof error.context?.json === 'function' ? await error.context.json().catch(() => null) : null;
    $('rgo').disabled = false;
    $('rmsg').innerHTML = note(j?.error || 'Gagal menghubungi server. Pastikan Edge Function reset-password sudah di-deploy.');
  };
  d.showModal();
}

async function pagePengaturan() {
  $('view').innerHTML = `<div class="row g-4">
    <div class="col-lg-6"><div class="card"><div class="card-body">
      <h5 class="mb-3">Profil</h5>
      <dl class="row mb-0">
        <dt class="col-4">Nama</dt><dd class="col-8">${esc(me.nama)}</dd>
        <dt class="col-4">Instansi</dt><dd class="col-8">${esc(me.kua || '-')}</dd>
        <dt class="col-4">Email</dt><dd class="col-8">${esc(me.email)}</dd>
        <dt class="col-4">Role</dt><dd class="col-8">${esc(me.role)}</dd>
      </dl></div></div></div>
    <div class="col-lg-6"><div class="card"><div class="card-body">
      <h5 class="mb-3">Ubah password</h5><div id="pmsg"></div>
      <form id="pf">${pwPair('np')}
      <button class="btn btn-primary" id="pgo">Simpan password</button></form></div></div></div>
    ${me.role === 'admin' ? `<div class="col-12"><div class="card"><div class="card-body">
      <h5 class="mb-3">Daftar akun</h5><div id="amsg"></div><div class="table-responsive" id="acc">Memuat…</div></div></div></div>` : ''}
  </div>`;
  bindPair('np');
  $('pf').onsubmit = async e => {
    e.preventDefault();
    if (!pairOk('np')) return $('pmsg').innerHTML = note(PW_ERR, 'warning');
    $('pgo').disabled = true;
    const { error } = await sb.auth.updateUser({ password: $('np1').value });
    $('pgo').disabled = false;
    $('pmsg').innerHTML = error ? note(errId(error)) : note('Password berhasil diubah.', 'success');
    if (!error) { $('pf').reset(); mask($('pf')); pairOk('np'); }
  };
  if (me.role === 'admin') {
    const { data } = await sb.from('profiles').select('id,nama,kua,role').order('role').order('nama');
    const el = $('acc');
    if (el) el.innerHTML = `<table class="table table-hover"><thead><tr><th>Nama</th><th>Instansi</th><th>Role</th><th class="text-end">Aksi</th></tr></thead><tbody>${
      (data || []).map(r => `<tr><td>${esc(r.nama)}</td><td>${esc(r.kua || '-')}</td><td><span class="badge bg-label-primary">${esc(r.role)}</span></td><td class="text-end">${r.role === 'operator' ? `<button class="btn btn-sm btn-outline-primary" data-reset="${esc(r.id)}"><i class="bx bx-key"></i> Reset password</button>` : ''}</td></tr>`).join('')
    }</tbody></table>`;
    if (el) el.onclick = e => { const b = e.target.closest('[data-reset]'); if (b) openReset((data || []).find(r => r.id === b.dataset.reset)); };
  }
}
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=tsReady&render=explicit" async defer></script>
</body>
</html>
